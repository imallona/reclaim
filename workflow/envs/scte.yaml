## Conda env for the scTE benchmark.
## scTE consumes a STAR/STARsolo-aligned BAM with CB and UB tags and a
## prebuilt scTE index. Writes a cell x repeat-family count matrix (gene-
## level annotation appears alongside but we benchmark the repeat side
## only).
name: repeats_scte
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - samtools
  - numpy
  - pandas
  - h5py
  - scipy
  - pip:
      ## scTE pins anndata loosely and the resolver lands on 0.6.x, which
      ## imports the removed pandas.core.index. Pin a modern anndata.
      - anndata==0.10.9
      - git+https://github.com/JiekaiLab/scTE.git
