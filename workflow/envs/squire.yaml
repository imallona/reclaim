name: repeats_squire
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=2.7
  - star=2.5.3a
  - samtools=1.9
  - bedtools=2.29.0
  - pip
  - pip:
      ## SQuIRE 0.9.9.92 is not on PyPI (only an unrelated 0.0.1); install the
      ## upstream source, whose master version is 0.9.9.92.
      - git+https://github.com/wyang17/SQuIRE.git
