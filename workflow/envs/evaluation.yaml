name: repeats_evaluation
channels:
  - conda-forge
  - bioconda
dependencies:
  # Also used for simulation rules (simulate_reads.py needs only stdlib + no extra deps)
  # cap python: 3.14 has no complete anndata dependency build set
  - conda-forge::python>=3.10,<3.13
  - conda-forge::pandas
  - conda-forge::scipy
  - conda-forge::numpy
  - conda-forge::matplotlib-base
  - conda-forge::seaborn
  # anndata: harmonize_external reads scTE's h5ad output
  - conda-forge::anndata
